name: Release

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    release:
        name: semantic-release
        runs-on: ubuntu-latest
        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        permissions:
            contents: write
            id-token: write
            issues: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: pnpm/action-setup@v4
              with:
                  version: 11.6.0

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run tests
              run: pnpm test

            - name: Build library
              run: pnpm build:lib

            - name: Release
              if: env.NPM_TOKEN != ''
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: pnpm release

            - name: Skip release
              if: env.NPM_TOKEN == ''
              run: echo "Skipping semantic-release because NPM_TOKEN is not configured."
